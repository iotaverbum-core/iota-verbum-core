[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iota-verbum-core"
version = "0.3.0"
description = "Deterministic core engine and production API for Iota Verbum."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Iota Verbum" }]
dependencies = [
  "alembic>=1.14.1",
  "fastapi>=0.115.0",
  "langdetect>=1.0.9",
  "langid>=1.1.6",
  "pdf2image>=1.16.0",
  "pdfplumber>=0.10.0",
  "pillow>=10.0.0",
  "pydantic>=2.9.0",
  "pytesseract>=0.3.10",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pandas>=3.0.2",
  "pytest==8.3.4",
  "ruff==0.6.8",
]
benchmark = [
  "anthropic>=0.49.0",
  "google-generativeai>=0.8.4",
  "openai>=1.68.2",
]

[project.scripts]
deterministic-ai = "deterministic_ai:main"
iota-verbum-api = "main:run"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["deterministic_ai"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core", "core.*", "domains", "domains.*", "iota_verbum_api", "iota_verbum_api.*", "proposal", "proposal.*"]

[tool.setuptools.package-data]
core = ["schemas/*.json", "rulesets/*.json"]
domains = ["**/*.json"]
iota_verbum_api = ["static/**/*"]

[tool.ruff]
cache-dir = ".ruff_cache"
exclude = [
  ".codex_temp",
  ".git",
  ".pytest_tmp",
  ".repro_check",
  ".ruff_cache",
  ".venv",
  ".venv311",
  "tmp_goldens",
  "tmp_repro_check",
]
line-length = 88
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"benchmark/cuc_metacognition_shared.py" = ["E501", "I001"]
"scripts/build_cuc_v5a_candidate_task.py" = ["E402", "E501"]
"scripts/cuc_metacognition_v4_candidate_runner_export_stub.ipynb" = ["E501", "F401", "F821", "I001"]
"scripts/cuc_metacognition_v5a_candidate_runner_export_stub.ipynb" = ["E501", "F821", "I001"]
"scripts/import_cuc_kaggle_results_zip.py" = ["E501", "F841", "I001"]
"scripts/import_cuc_v4_candidate_five_model_sweep.py" = ["E501", "F401", "I001"]
"scripts/import_cuc_v5a_64_case_model_sweep.py" = ["E501", "F541", "I001"]
"src/core/world/forward_projection.py" = ["E501", "F401", "I001"]
"src/domains/market_realtime/extractors.py" = ["E501", "F401", "F841", "I001"]
"tests/test_build_cuc_v5a_candidate_task.py" = ["E501"]
"tests/test_cuc_v4_candidate_notebook_stub.py" = ["E501"]
"tests/test_import_cuc_kaggle_results.py" = ["E501"]
"tests/test_import_cuc_v4_candidate_five_model_sweep.py" = ["E501"]
"tests/test_import_cuc_v5a_64_case_model_sweep.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
